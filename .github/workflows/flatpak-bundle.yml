name: Build Flatpak bundle

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Build and bundle
        run: |
          flatpak-builder --user --repo=repo --force-clean builddir \
            flatpak/io.github.Wian1977.BlackHoleScreensaver.yaml
          flatpak build-bundle --runtime-url=https://flathub.org/repo/flathub.flatpakrepo \
            repo BlackHoleScreensaver-1.1.0.flatpak \
            io.github.Wian1977.BlackHoleScreensaver

      - name: Upload bundle to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.1.0 BlackHoleScreensaver-1.1.0.flatpak \
            --clobber --repo "${{ github.repository }}"
